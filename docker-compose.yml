# All CENTMAIL_* env variables also support the CENTMAIL_*_FILE pattern for loading secrets from files with Docker secrets and Podman
# eg: CENTMAIL_ADMIN_USER -> CENTMAIL_ADMIN_USER_FILE=/path/to/file_with_value

x-db-credentials: &db-credentials                             # Use the default POSTGRES_ credentials if they're available or simply default to "centmail"
  POSTGRES_USER: &db-user centmail                            # for database user, password, and database name
  POSTGRES_PASSWORD: &db-password centmail
  POSTGRES_DB: &db-name centmail

services:
  # centmail app
  app:
    image: centmail/centmail:latest                            # No public image is published for this fork yet — build your own (`make dist && docker build .`) and update this line.
    container_name: centmail_app
    restart: unless-stopped
    ports:
      - "9000:9000"                                           # To change the externally exposed port, change to: $custom_port:9000
    networks:
      - centmail
    hostname: centmail.example.com                            # Recommend using FQDN for hostname
    depends_on:
      - db
    command: [sh, -c, "./centmail --install --idempotent --yes --config '' && ./centmail --upgrade --yes --config '' && ./centmail --config ''"]
                                                              # --config (file) param is set to empty so that centmail only uses the env vars (below) for config.
                                                              # --install --idempotent ensures that DB installation happens only once on an empty DB, on the first ever start.
                                                              # --upgrade automatically runs any DB migrations when a new image is pulled.

    environment:                                              # The same params as in config.toml are passed as env vars here.
      CENTMAIL_app__address: 0.0.0.0:9000
      CENTMAIL_db__user: *db-user
      CENTMAIL_db__password: *db-password
      CENTMAIL_db__database: *db-name
      CENTMAIL_db__host: db
      CENTMAIL_db__port: 5432
      CENTMAIL_db__ssl_mode: disable
      CENTMAIL_db__max_open: 25
      CENTMAIL_db__max_idle: 25
      CENTMAIL_db__max_lifetime: 300s
      TZ: Etc/UTC
      CENTMAIL_ADMIN_USER: ${CENTMAIL_ADMIN_USER:-}           # If these (optional) are set during the first `docker compose up`, then the Super Admin user is automatically created.
      CENTMAIL_ADMIN_PASSWORD: ${CENTMAIL_ADMIN_PASSWORD:-}   # Otherwise, the user can be setup on the web app after the first visit to http://localhost:9000
    volumes:
      - ./uploads:/centmail/uploads:rw                        # Mount an uploads directory on the host to /centmail/uploads inside the container.
                                                              # To use this, change directory path in Admin -> Settings -> Media to /centmail/uploads

  # Postgres database
  db:
    image: postgres:17-alpine
    container_name: centmail_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"                                 # Only bind on the local interface. To connect to Postgres externally, change this to 0.0.0.0
    networks:
      - centmail
    environment:
      <<: *db-credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centmail"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - type: volume
        source: centmail-data
        target: /var/lib/postgresql/data

networks:
  centmail:

volumes:
  centmail-data:
